<!--
  Supabase Dashboard → Authentication → Emails → Templates → "Confirm signup"
  Subject: Confirm your BarBuddy account
  Paste this file into the "Message body" (Source) field.
-->
<div style="background:#f0ece4;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#0f1f3d;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5dfd3;border-radius:12px;padding:32px;">
    <p style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:bold;">
      <span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border:1.5px solid #0f1f3d;border-radius:6px;margin-right:8px;">B</span>BarBuddy
    </p>

    <h1 style="margin:0 0 12px;font-size:22px;">Confirm your email</h1>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#4b5563;">
      Welcome to BarBuddy! Confirm your email address to activate your account and
      start your journey to the Philippine Bar.
    </p>

    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:#0f1f3d;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;padding:12px 24px;border-radius:8px;">
      Confirm my account
    </a>

    <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#6b7280;">
      If you didn't create a BarBuddy account, you can safely ignore this email.
    </p>
  </div>
  <p style="max-width:480px;margin:16px auto 0;text-align:center;font-size:11px;color:#6b7280;">
    BarBuddy · Your study partner for the Philippine Bar
  </p>
</div>
